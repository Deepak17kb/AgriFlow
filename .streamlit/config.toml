[theme]
base = "light"
primaryColor = "#12a878"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#f2f4f7"
textColor = "#101828"
borderColor = "#e4e7ec"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "0.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f7f9"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
